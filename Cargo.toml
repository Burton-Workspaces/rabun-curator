[package]
name = "rabun-curator"
version = "0.1.0"
edition = "2021"
description = "Karpathy LLM Wiki pattern as a local MCP server"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Burton-Workspaces/rabun-curator"
homepage = "https://github.com/Burton-Workspaces/rabun-curator"
keywords = ["mcp", "wiki", "obsidian", "markdown", "knowledge-graph", "rabun"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "rabun-curator"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
ignore = "0.4.33"
regex = "1.13.1"
rmcp = { version = "3.3.0", features = ["server", "transport-io"] }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml_edit = "0.25.15"

[dev-dependencies]
tempfile = "3.27.0"
